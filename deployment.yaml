apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    first: app

spec: #Behavior of the replicaset
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec: # spec & behavior of the pod
      containers:
        - name: nginx-cont
          image: nginx:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 85
      targetPort: 80
  type: ClusterIP



  
