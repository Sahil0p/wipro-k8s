# =========================
# NGINX DEPLOYMENT
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          ports:
            - containerPort: 80

---
# =========================
# NGINX SERVICE
# =========================
apiVersion: v1
kind: Service

metadata:
  name: nginx-service

spec:
  selector:
    app: nginx

  ports:
    - protocol: TCP
      port: 85
      targetPort: 80

  type: ClusterIP

---
# =========================
# LOC DEPLOYMENT
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loc

spec:
  replicas: 2

  selector:
    matchLabels:
      app: loc

  template:
    metadata:
      labels:
        app: loc

    spec:
      containers:
        - name: loc
          image: sahilahmed0029/loc:v1.0.0

          ports:
            - containerPort: 5000

---
# =========================
# LOC SERVICE
# =========================
apiVersion: v1
kind: Service

metadata:
  name: loc-service

spec:
  selector:
    app: loc

  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30007

  type: NodePort

---
