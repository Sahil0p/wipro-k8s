---
# =========================
# MONGODB DEPLOYMENT
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:latest

          ports:
            - containerPort: 27017

---
# =========================
# MONGODB SERVICE
# =========================
apiVersion: v1
kind: Service

metadata:
  name: mongodb-service

spec:
  selector:
    app: mongodb

  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

  type: ClusterIP

---
# =========================
# Vegetable-order-app
# =========================
apiVersion: apps/v1
kind: Deployment

metadata:
  name: vegetable

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vegetable

  template:
    metadata:
      labels:
        app: vegetable

    spec:
      containers:
        - name: vegetable
          image: sahilahmed0029/vegetable:v1.0.0

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: sahil-configmap
            - secretRef:
                name: sahil-secret
---
apiVersion: v1
kind: Service

metadata:
  name: vegetable-service

spec:
  type: NodePort

  selector:
    app: vegetable

  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080